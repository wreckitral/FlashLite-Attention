[build-system]
requires = [
    "setuptools>=61.0",
    "wheel",
    "torch>=2.0.0",
]
build-backend = "setuptools.build_meta"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[project]
name = "cuda_attention"
version = "0.1.0"
description = "CUDA Attention Implementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.3.4",
    "pandas>=2.3.3",
    "seaborn>=0.13.2",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "torchaudio>=2.0.0",
    "transformers>=4.57.1",
    "streamlit>=1.52.2",
    "plotly>=6.5.1",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.setuptools]
packages = ["python"]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
cuda = ["*.cu", "*.cuh", "*.h"]
cpp = ["*.cpp"]
